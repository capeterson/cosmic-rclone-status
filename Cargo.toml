[package]
name = "cosmic-rclone-status"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "COSMIC panel applet showing rclone mount and upload status"

[dependencies]
base64 = "0.22"
jiff = "0.2"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
ureq = { version = "2", features = ["json"] }
xdg-mime = "0.4"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["applet", "dbus-config", "multi-window", "tokio", "wayland", "winit"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Byte counts and percentages are converted to f64/f32 purely for display.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
